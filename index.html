<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Chicken Road 2</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
    background:#11141b;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    overflow-x:hidden;
}

body{
    display:flex;
    justify-content:center;
}

.game{
    width:100%;
    max-width:700px;
    min-height:100vh;
    background:#20232b;
    overflow:hidden;
    position:relative;
}

/* TOP BAR */

.topbar{
    height:78px;
    background:linear-gradient(110deg,#174c42,#0781c9);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
}

.back{
    width:48px;
    height:48px;
    border-radius:50%;
    background:rgba(0,0,0,.18);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
}

.title{
    font-size:26px;
    font-weight:800;
}

.balance{
    min-width:125px;
    height:52px;
    border-radius:17px;
    background:#199ce4;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:20px;
    font-weight:bold;
    padding:0 12px;
}

.coin{
    width:28px;
    height:28px;
    border-radius:50%;
    background:linear-gradient(#ffe56b,#e6a900);
    color:#805c00;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    font-weight:900;
    border:2px solid #fff1a4;
}

/* LOGO BAR */

.brandbar{
    height:115px;
    background:#22252d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
}

.logo{
    font-size:29px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.logo span{
    color:#e92c31;
    font-size:43px;
}

.logo small{
    font-size:11px;
    color:#ddd;
    display:block;
    margin-top:-7px;
    letter-spacing:2px;
}

.balance2{
    background:#5b5e65;
    min-width:170px;
    height:64px;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    font-size:28px;
    font-weight:bold;
}

/* ONLINE */

.online{
    position:absolute;
    top:178px;
    left:35px;
    z-index:20;
    background:rgba(56,57,61,.94);
    padding:15px 25px;
    border-radius:0 0 18px 18px;
    font-size:20px;
}

.greenDot{
    display:inline-block;
    width:20px;
    height:20px;
    background:#36e85e;
    border-radius:50%;
    margin-right:10px;
    box-shadow:0 0 15px #36e85e;
}

/* GAME AREA */

.gameArea{
    height:620px;
    position:relative;
    overflow:hidden;
    background:#73b93a;
}

/* SIDE GRASS */

.grass{
    position:absolute;
    left:0;
    top:0;
    width:25%;
    height:100%;
    background:
      radial-gradient(circle at 20% 15%,#65a931 0 22px,transparent 23px),
      radial-gradient(circle at 75% 30%,#67aa32 0 28px,transparent 29px),
      radial-gradient(circle at 30% 65%,#5fa22e 0 25px,transparent 26px),
      linear-gradient(90deg,#6ab635,#78bd3c);
}

.grass:after{
    content:"";
    position:absolute;
    top:0;
    right:0;
    width:9px;
    height:100%;
    background:#c9c9c9;
    box-shadow:
      8px 0 0 #a8a8a8,
      15px 0 0 #d7d7d7;
}

/* SIDEWALK */

.sidewalk{
    position:absolute;
    left:25%;
    top:0;
    width:12%;
    height:100%;
    background:
      repeating-linear-gradient(
        to bottom,
        #d0d0d0 0px,
        #d0d0d0 58px,
        #b3b3b3 59px,
        #b3b3b3 63px
      );
    border-right:5px solid #999;
}

/* ROAD */

.road{
    position:absolute;
    left:37%;
    top:0;
    width:63%;
    height:100%;
    background:#686868;
}

/* ROAD LANES */

.lane{
    position:absolute;
    top:0;
    height:100%;
    border-right:5px dashed rgba(255,255,255,.9);
}

.lane1{
    left:0;
    width:33.33%;
}

.lane2{
    left:33.33%;
    width:33.33%;
}

.lane3{
    left:66.66%;
    width:33.34%;
    border-right:0;
}

.laneLine{
    position:absolute;
    left:0;
    top:0;
    width:5px;
    height:100%;
    background:repeating-linear-gradient(
        to bottom,
        #fff 0 60px,
        transparent 60px 115px
    );
    opacity:.9;
}

/* CROSSING */

.crossLine{
    position:absolute;
    left:37%;
    width:63%;
    height:5px;
    background:rgba(255,255,255,.18);
}

/* CHICKEN */

.chicken{
    position:absolute;
    z-index:15;
    left:11%;
    bottom:30px;
    width:105px;
    height:130px;
    transition:
        left .22s ease,
        bottom .22s ease,
        transform .18s ease;
}

.chickenBody{
    position:absolute;
    left:12px;
    bottom:5px;
    width:78px;
    height:85px;
    background:#fff;
    border:3px solid #e1e1e1;
    border-radius:50% 50% 45% 45%;
    box-shadow:0 5px 8px rgba(0,0,0,.25);
}

.chickenHead{
    position:absolute;
    left:7px;
    top:0;
    width:90px;
    height:82px;
    background:#fff;
    border:3px solid #e1e1e1;
    border-radius:50%;
}

.eye{
    position:absolute;
    top:22px;
    width:25px;
    height:31px;
    background:#fff;
    border:3px solid #222;
    border-radius:50%;
}

.eye:after{
    content:"";
    position:absolute;
    width:8px;
    height:12px;
    background:#111;
    border-radius:50%;
    left:6px;
    top:7px;
}

.eye1{
    left:17px;
}

.eye2{
    right:17px;
}

.beak{
    position:absolute;
    right:-18px;
    top:42px;
    width:0;
    height:0;
    border-top:12px solid transparent;
    border-bottom:12px solid transparent;
    border-left:25px solid #f3a900;
}

.comb{
    position:absolute;
    left:30px;
    top:-14px;
    width:38px;
    height:25px;
    background:#e62d31;
    border-radius:50% 50% 20% 20%;
    transform:rotate(-8deg);
}

.wattle{
    position:absolute;
    right:-7px;
    top:57px;
    width:18px;
    height:28px;
    background:#e62d31;
    border-radius:50%;
}

.foot{
    position:absolute;
    bottom:0;
    width:25px;
    height:10px;
    background:#efa900;
    border-radius:50%;
}

.foot1{
    left:24px;
}

.foot2{
    left:62px;
}

/* CARS */

.car{
    position:absolute;
    z-index:12;
    width:88px;
    height:145px;
    top:-180px;
    border-radius:22px;
    border:6px solid rgba(0,0,0,.18);
    box-shadow:
        0 8px 14px rgba(0,0,0,.35),
        inset 0 0 0 3px rgba(255,255,255,.18);
}

.car:before,
.car:after{
    content:"";
    position:absolute;
    width:18px;
    height:46px;
    background:#1d2025;
    border-radius:12px;
    top:43px;
}

.car:before{
    left:-13px;
}

.car:after{
    right:-13px;
}

.window{
    position:absolute;
    top:17px;
    left:12px;
    right:12px;
    height:48px;
    background:#5cb6ca;
    border:5px solid #273c45;
    border-radius:10px;
}

.bumper{
    position:absolute;
    bottom:17px;
    left:14px;
    right:14px;
    height:28px;
    background:#272a30;
    border-radius:7px;
}

.car.yellow{
    background:#ffae18;
}

.car.red{
    background:#ef3b3b;
}

.car.green{
    background:#4fc93c;
}

.car.blue{
    background:#3989e8;
}

.car.white{
    background:#e8e8e8;
}

/* MULTIPLIER */

.multiplier{
    position:absolute;
    z-index:8;
    width:135px;
    height:135px;
    border-radius:50%;
    background:
      repeating-linear-gradient(
        90deg,
        #333 0 6px,
        #3f3f3f 6px 11px
      );
    border:9px solid #4b4b4b;
    box-shadow:
      inset 0 0 0 5px #262626,
      0 4px 8px rgba(0,0,0,.3);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:900;
}

.multi1{
    left:39%;
    top:45%;
}

.multi2{
    left:65%;
    top:58%;
}

/* START COUNTDOWN */

.countdown{
    position:absolute;
    z-index:50;
    left:50%;
    top:40%;
    transform:translate(-50%,-50%);
    font-size:85px;
    font-weight:900;
    text-shadow:0 5px 20px #000;
    display:none;
}

/* MESSAGE */

.message{
    position:absolute;
    z-index:60;
    top:45%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,.72);
    padding:18px 30px;
    border-radius:18px;
    font-size:25px;
    font-weight:bold;
    display:none;
    white-space:nowrap;
}

/* CONTROL PANEL */

.controls{
    position:relative;
    z-index:70;
    margin-top:-2px;
    padding:27px 25px 35px;
    background:#292c33;
    border-radius:28px 28px 0 0;
    box-shadow:0 -5px 20px rgba(0,0,0,.35);
}

.betBox{
    height:76px;
    border-radius:18px;
    background:#5c5f65;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    font-size:28px;
    box-shadow:0 5px 8px rgba(0,0,0,.25);
}

.betBtn{
    background:#707279;
    border:0;
    color:#fff;
    padding:13px 20px;
    border-radius:13px;
    font-size:19px;
    font-weight:bold;
}

.betValue{
    font-size:28px;
}

.quick{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:20px;
}

.quick button{
    height:70px;
    border:0;
    border-radius:16px;
    background:#5b5e65;
    color:#fff;
    font-size:20px;
    box-shadow:0 5px 8px rgba(0,0,0,.22);
}

.difficulty{
    margin-top:20px;
    height:75px;
    border-radius:18px;
    background:#5b5e65;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    font-size:25px;
    font-weight:bold;
    cursor:pointer;
}

.diffMenu{
    display:none;
    margin-top:5px;
    background:#505258;
    border-radius:15px;
    overflow:hidden;
}

.diffMenu div{
    padding:17px 25px;
    font-size:19px;
}

.diffMenu div:hover{
    background:#686b72;
}

.play{
    margin-top:20px;
    width:100%;
    height:82px;
    border:0;
    border-radius:20px;
    background:#35d052;
    color:white;
    font-size:39px;
    font-weight:900;
    box-shadow:0 6px 10px rgba(0,0,0,.3);
}

.play:active{
    transform:scale(.98);
}

.play.running{
    background:#e8a91a;
}

/* MOBILE */

@media(max-width:480px){

    .topbar{
        height:72px;
        padding:0 13px;
    }

    .title{
        font-size:23px;
    }

    .balance{
        min-width:110px;
        font-size:17px;
    }

    .brandbar{
        height:105px;
        padding:0 18px;
    }

    .logo{
        font-size:24px;
    }

    .logo span{
        font-size:36px;
    }

    .balance2{
        min-width:135px;
        height:58px;
        font-size:23px;
    }

    .online{
        top:177px;
        left:35px;
        font-size:17px;
        padding:13px 17px;
    }

    .gameArea{
        height:595px;
    }

    .chicken{
        transform:scale(.88);
        transform-origin:bottom left;
    }

    .car{
        width:75px;
        height:125px;
    }

    .multiplier{
        width:120px;
        height:120px;
        font-size:25px;
    }

    .controls{
        padding:25px 20px 35px;
    }

    .quick{
        gap:10px;
    }

    .quick button{
        font-size:17px;
    }

    .play{
        height:75px;
        font-size:34px;
    }
}
</style>
</head>

<body>

<div class="game">

    <!-- TOP -->
    <div class="topbar">
        <div class="back">‹</div>

        <div class="title">Chicken Road 2</div>

        <div class="balance">
            <div class="coin">C</div>
            <span id="topCoins">1000</span>
        </div>
    </div>

    <!-- BRAND -->
    <div class="brandbar">
        <div class="logo">
            CHICKEN <span>2</span> ROAD
            <small>ROAD CROSSING GAME</small>
        </div>

        <div class="balance2">
            <span id="coins2">1000</span>
            <div class="coin">C</div>
        </div>
    </div>

    <!-- ONLINE -->
    <div class="online">
        <span class="greenDot"></span>
        Live wins:
        &nbsp; Online:
        <b id="online">10950</b>
    </div>

    <!-- GAME -->
    <div class="gameArea" id="gameArea">

        <div class="grass"></div>

        <div class="sidewalk"></div>

        <div class="road">

            <!-- THREE INDEPENDENT TRACKS -->
            <div class="lane lane1">
                <div class="laneLine"></div>
            </div>

            <div class="lane lane2">
                <div class="laneLine"></div>
            </div>

            <div class="lane lane3">
                <div class="laneLine"></div>
            </div>

        </div>

        <div class="crossLine" style="top:25%"></div>
        <div class="crossLine" style="top:50%"></div>
        <div class="crossLine" style="top:75%"></div>

        <!-- MULTIPLIERS -->
        <div class="multiplier multi1">1.18x</div>
        <div class="multiplier multi2">1.46x</div>

        <!-- CHICKEN -->
        <div class="chicken" id="chicken">

            <div class="comb"></div>

            <div class="chickenHead">
                <div class="eye eye1"></div>
                <div class="eye eye2"></div>
                <div class="beak"></div>
                <div class="wattle"></div>
            </div>

            <div class="chickenBody"></div>

            <div class="foot foot1"></div>
            <div class="foot foot2"></div>

        </div>

        <!-- CARS -->

        <div class="car yellow" id="car1">
            <div class="window"></div>
            <div class="bumper"></div>
        </div>

        <div class="car green" id="car2">
            <div class="window"></div>
            <div class="bumper"></div>
        </div>

        <div class="car red" id="car3">
            <div class="window"></div>
            <div class="bumper"></div>
        </div>

        <div class="car blue" id="car4">
            <div class="window"></div>
            <div class="bumper"></div>
        </div>

        <div class="car white" id="car5">
            <div class="window"></div>
            <div class="bumper"></div>
        </div>

        <!-- COUNTDOWN -->
        <div class="countdown" id="countdown">3</div>

        <div class="message" id="message"></div>

    </div>

    <!-- CONTROLS -->
    <div class="controls">

        <div class="betBox">

            <button class="betBtn" onclick="changeBet(-20)">
                MIN
            </button>

            <div class="betValue">
                <span id="bet">60</span>
            </div>

            <button class="betBtn" onclick="changeBet(20)">
                MAX
            </button>

        </div>

        <div class="quick">

            <button onclick="setBet(40)">
                40 🪙
            </button>

            <button onclick="setBet(60)">
                60 🪙
            </button>

            <button onclick="setBet(150)">
                150 🪙
            </button>

            <button onclick="setBet(400)">
                400 🪙
            </button>

        </div>

        <div class="difficulty" onclick="toggleDifficulty()">
            <span id="difficultyText">Hard</span>
            <span>⌄</span>
        </div>

        <div class="diffMenu" id="diffMenu">

            <div onclick="setDifficulty('Easy')">
                Easy
            </div>

            <div onclick="setDifficulty('Medium')">
                Medium
            </div>

            <div onclick="setDifficulty('Hard')">
                ✓ Hard
            </div>

            <div onclick="setDifficulty('Hardcore')">
                Hardcore
            </div>

        </div>

        <button class="play" id="playBtn" onclick="startGame()">
            Play
        </button>

    </div>

</div>

<script>

/* =========================
   GAME VARIABLES
========================= */

let coins = 1000;

let bet = 60;

let difficulty = "Hard";

let playing = false;

let gameTimer = null;

let chickenStep = 0;

let maxSteps = 6;

let cars = [];

let animationFrame = null;

let startTime = 0;


/* =========================
   ELEMENTS
========================= */

const chicken =
    document.getElementById("chicken");

const gameArea =
    document.getElementById("gameArea");

const playBtn =
    document.getElementById("playBtn");

const countdown =
    document.getElementById("countdown");

const message =
    document.getElementById("message");

const online =
    document.getElementById("online");

const topCoins =
    document.getElementById("topCoins");

const coins2 =
    document.getElementById("coins2");


/* =========================
   ONLINE NUMBER
========================= */

setInterval(() => {

    let n =
        10950 +
        Math.floor(Math.random()*30);

    online.textContent = n;

},3500);


/* =========================
   COINS
========================= */

function updateCoins(){

    topCoins.textContent =
        coins;

    coins2.textContent =
        coins;

}


/* =========================
   BET
========================= */

function setBet(value){

    if(value < 20)
        value = 20;

    if(value > 500)
        value = 500;

    bet = value;

    document.getElementById("bet")
        .textContent = bet;

}


function changeBet(amount){

    setBet(bet + amount);

}


/* =========================
   DIFFICULTY
========================= */

function toggleDifficulty(){

    const menu =
        document.getElementById("diffMenu");

    menu.style.display =
        menu.style.display === "block"
        ? "none"
        : "block";

}


function setDifficulty(value){

    difficulty = value;

    document.getElementById(
        "difficultyText"
    ).textContent = value;

    document.getElementById(
        "diffMenu"
    ).style.display = "none";

}


/* =========================
   GAME SPEED
========================= */

function getSpeed(){

    if(difficulty === "Easy")
        return 1.8;

    if(difficulty === "Medium")
        return 2.5;

    if(difficulty === "Hard")
        return 3.3;

    return 4.2;
}


/* =========================
   RESET CHICKEN
========================= */

function resetChicken(){

    chickenStep = 0;

    chicken.style.left = "11%";

    chicken.style.bottom = "30px";

}


/* =========================
   MOVE CHICKEN
========================= */

function moveChicken(){

    if(!playing)
        return;

    if(chickenStep >= maxSteps)
        return;

    chickenStep++;

    const progress =
        chickenStep / maxSteps;

    const left =
        11 + progress * 66;

    const bottom =
        30 + progress * 75;

    chicken.style.left =
        left + "%";

    chicken.style.bottom =
        bottom + "px";

    chicken.style.transform =
        "scale(.88) translateY(-4px)";

    setTimeout(() => {

        chicken.style.transform =
            "scale(.88)";

    },120);


    if(chickenStep >= maxSteps){

        setTimeout(winGame,300);

    }

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "ArrowUp" ||
            e.key === " " ||
            e.key === "w" ||
            e.key === "W"
        ){

            e.preventDefault();

            moveChicken();

        }

    }
);


/* =========================
   TOUCH / CLICK
========================= */

chicken.addEventListener(
    "click",
    function(){

        moveChicken();

    }
);

gameArea.addEventListener(
    "click",
    function(e){

        if(!playing)
            return;

        if(
            e.target.classList.contains("car")
        )
            return;

        moveChicken();

    }
);


/* =========================
   START GAME
========================= */

function startGame(){

    if(playing)
        return;

    if(coins < bet){

        showMessage(
            "Not enough coins"
        );

        return;

    }

    coins -= bet;

    updateCoins();

    resetChicken();

    removeCars();

    playing = false;

    playBtn.textContent =
        "Starting...";

    playBtn.classList.add("running");

    countdown.style.display =
        "block";

    let count = 3;

    countdown.textContent =
        count;

    const countTimer =
        setInterval(() => {

            count--;

            if(count <= 0){

                clearInterval(countTimer);

                countdown.style.display =
                    "none";

                beginRound();

            }else{

                countdown.textContent =
                    count;

            }

        },1000);

}


/* =========================
   BEGIN ROUND
========================= */

function beginRound(){

    playing = true;

    startTime = Date.now();

    playBtn.textContent =
        "Running...";

    /*
      IMPORTANT:
      Cars are not created together.
      Each track receives traffic
      with different delays.
    */

    setTimeout(() => {

        if(playing)
            spawnCar(0);

    },700);


    setTimeout(() => {

        if(playing)
            spawnCar(1);

    },2100);


    setTimeout(() => {

        if(playing)
            spawnCar(2);

    },3900);


    setTimeout(() => {

        if(playing)
            spawnCar(0);

    },5600);


    setTimeout(() => {

        if(playing)
            spawnCar(1);

    },7300);

}


/* =========================
   SPAWN CAR
========================= */

function spawnCar(lane){

    if(!playing)
        return;

    const car =
        document.createElement("div");

    car.className =
        "car " +
        randomCarColor();

    const windowDiv =
        document.createElement("div");

    windowDiv.className =
        "window";

    const bumper =
        document.createElement("div");

    bumper.className =
        "bumper";

    car.appendChild(windowDiv);

    car.appendChild(bumper);

    gameArea.appendChild(car);

    /*
       Each car stays strictly
       inside its own track.
    */

    const roadLeft =
        37;

    const laneWidth =
        63 / 3;

    const laneStart =
        roadLeft +
        lane * laneWidth;

    const carLeft =
        laneStart +
        (laneWidth / 2) -
        5.5;

    car.style.left =
        carLeft + "%";

    car.style.top =
        "-180px";

    cars.push({

        element:car,

        lane:lane,

        y:-180,

        speed:getSpeed() +
            Math.random()*1.3

    });

}


/* =========================
   RANDOM CAR
========================= */

function randomCarColor(){

    const colors = [
        "yellow",
        "red",
        "green",
        "blue",
        "white"
    ];

    return colors[
        Math.floor(
            Math.random()*colors.length
        )
    ];

}


/* =========================
   ANIMATION
========================= */

function animateCars(){

    if(!playing){

        animationFrame =
            requestAnimationFrame(
                animateCars
            );

        return;

    }

    const areaHeight =
        gameArea.clientHeight;

    for(let i=cars.length-1;i>=0;i--){

        const c = cars[i];

        c.y += c.speed;

        c.element.style.top =
            c.y + "px";

        if(checkCollision(c)){

            loseGame();

            return;

        }

        if(c.y > areaHeight + 180){

            c.element.remove();

            cars.splice(i,1);

        }

    }

    animationFrame =
        requestAnimationFrame(
            animateCars
        );

}


/* =========================
   COLLISION
========================= */

function checkCollision(c){

    const a =
        chicken.getBoundingClientRect();

    const b =
        c.element.getBoundingClientRect();

    /*
      Small collision box so the game
      feels fair on mobile.
    */

    const pad = 15;

    return !(
        a.right-pad < b.left ||
        a.left+pad > b.right ||
        a.bottom-pad < b.top ||
        a.top+pad > b.bottom
    );

}


/* =========================
   WIN
========================= */

function winGame(){

    if(!playing)
        return;

    playing = false;

    const elapsed =
        (Date.now()-startTime)/1000;

    let multiplier = 1.18;

    if(difficulty === "Easy")
        multiplier = 1.10;

    if(difficulty === "Medium")
        multiplier = 1.25;

    if(difficulty === "Hard")
        multiplier = 1.46;

    if(difficulty === "Hardcore")
        multiplier = 1.80;

    const reward =
        Math.floor(
            bet * multiplier
        );

    coins += reward;

    updateCoins();

    playBtn.textContent =
        "Play Again";

    playBtn.classList.remove(
        "running"
    );

    showMessage(
        "🐔 SAFE! +" +
        reward +
        " COINS • " +
        multiplier.toFixed(2) +
        "x"
    );

    removeCars();

    resetChicken();

}


/* =========================
   LOSE
========================= */

function loseGame(){

    if(!playing)
        return;

    playing = false;

    playBtn.textContent =
        "Try Again";

    playBtn.classList.remove(
        "running"
    );

    showMessage(
        "💥 CAR HIT! Round Over"
    );

    removeCars();

    setTimeout(() => {

        resetChicken();

    },1000);

}


/* =========================
   REMOVE CARS
========================= */

function removeCars(){

    cars.forEach(c => {

        if(c.element)
            c.element.remove();

    });

    cars = [];

}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

    message.textContent =
        text;

    message.style.display =
        "block";

    setTimeout(() => {

        message.style.display =
            "none";

    },2200);

}


/* =========================
   GAME LOOP
========================= */

animateCars();


/* =========================
   INITIAL
========================= */

updateCoins();

resetChicken();

</script>

</body>
</html>
