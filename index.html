<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Chicken Road 2</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101318;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

button{
  border:0;
  outline:none;
  font-family:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:#15171b;
}

/* TOP */
.top{
  height:62px;
  min-height:62px;
  background:linear-gradient(135deg,#20362c,#12558b);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
}

.back{
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(0,0,0,.20);
  color:#fff;
  font-size:34px;
  line-height:38px;
}

.gameTitle{
  font-size:24px;
  font-weight:700;
}

.deposit{
  background:linear-gradient(135deg,#1688e0,#0870c5);
  color:#fff;
  padding:11px 14px;
  border-radius:22px;
  font-size:14px;
  font-weight:700;
}

/* HEADER */
.header{
  height:76px;
  min-height:76px;
  background:#25272b;
  display:flex;
  align-items:center;
  padding:0 18px;
  position:relative;
  z-index:50;
}

.logo{
  font-size:25px;
  font-weight:900;
  letter-spacing:-1.4px;
  white-space:nowrap;
}

.logo .two{
  color:#e42d35;
  font-size:40px;
  font-style:italic;
  margin:0 1px;
}

.balance{
  margin-left:auto;
  width:150px;
  height:50px;
  border-radius:9px;
  background:#55565a;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
  font-size:22px;
  font-weight:700;
}

.coin{
  width:27px;
  height:27px;
  border-radius:50%;
  background:#fff;
  color:#555;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:900;
}

.menu{
  margin-left:16px;
  font-size:32px;
}

/* LIVE */
.live{
  position:absolute;
  top:138px;
  left:20px;
  z-index:100;
  padding:12px 17px;
  background:rgba(45,46,48,.82);
  border-radius:0 0 8px 8px;
  font-size:16px;
  backdrop-filter:blur(5px);
}

.greenDot{
  display:inline-block;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#35ed62;
  box-shadow:0 0 12px #35ed62;
  margin-right:9px;
}

/* GAME */
.game{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  background:#6e6d6c;
}

/* GRASS */
.grass{
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:12%;
  background:
  radial-gradient(circle at 40% 12%,#81d239 0 28px,transparent 29px),
  radial-gradient(circle at 75% 30%,#6dbc2c 0 35px,transparent 36px),
  radial-gradient(circle at 25% 55%,#79c832 0 32px,transparent 33px),
  radial-gradient(circle at 70% 78%,#62b728 0 38px,transparent 39px),
  #579c22;
}

/* SIDEWALK */
.sidewalk{
  position:absolute;
  left:12%;
  top:0;
  bottom:0;
  width:22%;
  background:
    repeating-linear-gradient(
      to bottom,
      #d0d0cc 0px,
      #d0d0cc 78px,
      #aaa9a5 79px,
      #aaa9a5 83px
    );
  border-right:8px solid #9b9b98;
}

/* ROAD */
.road{
  position:absolute;
  left:34%;
  right:0;
  top:0;
  bottom:0;
  background:#6e6d6b;
}

/* ROAD LANES */
.laneLine{
  position:absolute;
  top:-100px;
  bottom:-100px;
  width:5px;
  background:
    repeating-linear-gradient(
      to bottom,
      #f1f1f1 0,
      #f1f1f1 55px,
      transparent 55px,
      transparent 110px
    );
}

.line1{
  left:33%;
}

.line2{
  left:66%;
}

/* SIDE ROAD EDGES */
.roadEdge{
  position:absolute;
  top:0;
  bottom:0;
  width:8px;
  background:#575757;
}

.edgeLeft{
  left:0;
}

.edgeRight{
  right:0;
}

/* STREET LIGHT */
.streetLight{
  position:absolute;
  left:15%;
  top:10%;
  width:12px;
  height:290px;
  background:#55595d;
  border-radius:10px;
  z-index:3;
}

.streetLight:before{
  content:"";
  position:absolute;
  top:-4px;
  left:-28px;
  width:70px;
  height:20px;
  background:#55595d;
  border-radius:20px;
}

.streetLight:after{
  content:"";
  position:absolute;
  bottom:-8px;
  left:-30px;
  width:72px;
  height:25px;
  border-radius:50%;
  background:#55595d;
}

/* MULTIPLIERS */
.multiplier{
  position:absolute;
  z-index:4;
  width:150px;
  height:150px;
  border-radius:50%;
  background:
    repeating-linear-gradient(
      90deg,
      #46484a 0,
      #46484a 7px,
      #393b3d 7px,
      #393b3d 12px
    );
  border:9px solid #4b4d4f;
  box-shadow:
    inset 0 0 0 6px rgba(255,255,255,.06),
    0 6px 14px rgba(0,0,0,.25);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:29px;
  font-weight:900;
  text-shadow:2px 2px 2px #222;
  color:#eee;
  opacity:.86;
}

.multi1{
  left:38%;
  top:44%;
}

.multi2{
  left:75%;
  top:55%;
}

/* CHICKEN */
.chicken{
  position:absolute;
  z-index:40;
  width:112px;
  height:125px;
  left:14%;
  bottom:6%;
  transition:
    left .28s ease,
    bottom .28s ease,
    transform .18s ease;
  filter:drop-shadow(0 8px 7px rgba(0,0,0,.28));
}

.chickenBody{
  position:absolute;
  width:83px;
  height:78px;
  left:14px;
  bottom:5px;
  background:#fff;
  border:3px solid #d7d7d7;
  border-radius:48% 48% 43% 43%;
}

.chickenHead{
  position:absolute;
  width:76px;
  height:72px;
  left:29px;
  top:6px;
  background:#fff;
  border:3px solid #d7d7d7;
  border-radius:50%;
}

.eye{
  position:absolute;
  width:26px;
  height:33px;
  top:18px;
  background:#fff;
  border:3px solid #252525;
  border-radius:50%;
}

.eye:after{
  content:"";
  position:absolute;
  width:9px;
  height:12px;
  left:6px;
  top:6px;
  border-radius:50%;
  background:#171717;
}

.eyeL{
  left:6px;
}

.eyeR{
  right:6px;
}

.comb{
  position:absolute;
  top:-16px;
  left:23px;
  width:39px;
  height:25px;
  background:#e9282d;
  border-radius:55% 55% 20% 20%;
  transform:rotate(-7deg);
}

.beak{
  position:absolute;
  right:-17px;
  top:39px;
  width:0;
  height:0;
  border-top:12px solid transparent;
  border-bottom:12px solid transparent;
  border-left:25px solid #f2a719;
}

.wattle{
  position:absolute;
  right:-1px;
  top:56px;
  width:16px;
  height:25px;
  background:#eb2c2f;
  border-radius:50%;
}

.foot{
  position:absolute;
  bottom:0;
  width:28px;
  height:12px;
  background:#eead1a;
  border-radius:50%;
}

.foot1{
  left:31px;
}

.foot2{
  left:63px;
}

/* VEHICLES */
.vehicle{
  position:absolute;
  z-index:25;
  width:88px;
  height:140px;
  border-radius:14px 14px 10px 10px;
  box-shadow:0 8px 13px rgba(0,0,0,.38);
  display:none;
}

/* CAR BODY */
.car{
  background:#e83434;
  border:5px solid #a92121;
}

.car.green{
  background:#54ca42;
  border-color:#2e9628;
}

.car.blue{
  background:#348ee4;
  border-color:#2161a1;
}

.car.yellow{
  background:#f0a52b;
  border-color:#bb6716;
}

/* CAR WINDOW */
.windowTop{
  position:absolute;
  top:16px;
  left:10px;
  right:10px;
  height:42px;
  border-radius:8px;
  background:#357c91;
  border:4px solid #3d464b;
}

.windowTop:after{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  bottom:0;
  width:3px;
  background:#42565d;
}

/* BUMPER */
.bumper{
  position:absolute;
  left:10px;
  right:10px;
  bottom:10px;
  height:22px;
  background:#34373b;
  border-radius:6px;
}

.lightA,
.lightB{
  position:absolute;
  bottom:19px;
  width:13px;
  height:8px;
  background:#fff;
  border-radius:4px;
}

.lightA{
  left:8px;
}

.lightB{
  right:8px;
}

/* TRUCK */
.truck{
  width:104px;
  height:158px;
  background:#eee;
  border:5px solid #aaa;
  border-radius:13px;
}

.truckCab{
  position:absolute;
  left:8px;
  right:8px;
  top:20px;
  height:48px;
  background:#59aeb9;
  border:4px solid #4a5559;
  border-radius:7px;
}

.truckBody{
  position:absolute;
  left:9px;
  right:9px;
  bottom:15px;
  height:65px;
  background:#fafafa;
  border-radius:5px;
}

/* COUNTDOWN */
.countdown{
  position:absolute;
  z-index:200;
  left:50%;
  top:43%;
  transform:translate(-50%,-50%);
  font-size:90px;
  font-weight:900;
  text-shadow:0 7px 20px rgba(0,0,0,.55);
  display:none;
}

.countdown.show{
  display:block;
  animation:countPop .75s ease;
}

@keyframes countPop{
  0%{
    transform:translate(-50%,-50%) scale(1.5);
    opacity:0;
  }
  50%{
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
  }
  100%{
    transform:translate(-50%,-50%) scale(.95);
  }
}

/* GO */
.goText{
  position:absolute;
  z-index:201;
  left:50%;
  top:43%;
  transform:translate(-50%,-50%);
  font-size:70px;
  font-weight:900;
  color:#3fe05b;
  text-shadow:0 5px 18px rgba(0,0,0,.5);
  display:none;
}

/* MESSAGE */
.message{
  position:absolute;
  z-index:210;
  left:50%;
  top:13px;
  transform:translateX(-50%);
  background:rgba(25,25,25,.88);
  padding:9px 17px;
  border-radius:20px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.message.show{
  opacity:1;
}

/* RESULT */
.result{
  position:absolute;
  z-index:300;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:82%;
  max-width:340px;
  padding:25px;
  background:#292a2d;
  border:2px solid #555;
  border-radius:20px;
  text-align:center;
  display:none;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
}

.result.show{
  display:block;
}

.result h2{
  font-size:30px;
  margin-bottom:12px;
}

.result p{
  white-space:pre-line;
  color:#ddd;
  font-size:18px;
  line-height:1.5;
  margin-bottom:18px;
}

.resultBtn{
  width:100%;
  height:52px;
  background:#3dcc58;
  color:#fff;
  border-radius:10px;
  font-size:20px;
  font-weight:800;
}

/* CONTROL */
.panel{
  position:relative;
  z-index:500;
  background:#363738;
  border:2px solid #505153;
  border-radius:20px 20px 0 0;
  padding:15px 20px 17px;
  box-shadow:0 -8px 30px rgba(0,0,0,.35);
}

.bet{
  height:58px;
  background:#55565a;
  border-radius:9px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 14px;
  box-shadow:0 3px 8px rgba(0,0,0,.3);
}

.betBtn{
  background:#6a6b6f;
  color:#fff;
  padding:10px 17px;
  border-radius:7px;
  font-size:15px;
  font-weight:800;
}

.betNumber{
  font-size:21px;
}

.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:11px;
}

.quick button{
  height:54px;
  background:#55565a;
  color:#fff;
  border-radius:10px;
  font-size:16px;
  box-shadow:0 3px 8px rgba(0,0,0,.3);
}

/* DIFFICULTY */
.difficulty{
  position:relative;
  margin-top:11px;
}

.diffButton{
  width:100%;
  height:58px;
  background:#55565a;
  color:#fff;
  border-radius:9px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 28px;
  font-size:19px;
  font-weight:800;
}

.diffMenu{
  position:absolute;
  left:0;
  right:0;
  bottom:66px;
  background:#55565a;
  border-radius:9px;
  overflow:hidden;
  display:none;
  z-index:1000;
  box-shadow:0 10px 30px rgba(0,0,0,.55);
}

.diffMenu.open{
  display:block;
}

.option{
  height:58px;
  display:flex;
  align-items:center;
  padding:0 22px;
  font-size:18px;
}

.option:hover{
  background:#66676b;
}

.check{
  margin-left:auto;
  color:#ffd22d;
  font-size:23px;
}

/* PLAY */
.play{
  width:100%;
  height:68px;
  margin-top:17px;
  background:#3dcc58;
  color:#fff;
  border-radius:16px;
  font-size:42px;
  font-weight:900;
  box-shadow:
    0 5px 0 #249b3b,
    0 10px 20px rgba(0,0,0,.3);
}

.play:active{
  transform:translateY(3px);
  box-shadow:0 2px 0 #249b3b;
}

/* MOBILE */
@media(max-width:600px){

  .gameTitle{
    font-size:23px;
  }

  .deposit{
    font-size:13px;
    padding:10px 11px;
  }

  .header{
    height:70px;
    min-height:70px;
    padding:0 14px;
  }

  .logo{
    font-size:20px;
  }

  .logo .two{
    font-size:32px;
  }

  .balance{
    width:112px;
    height:46px;
    font-size:20px;
  }

  .menu{
    margin-left:10px;
    font-size:28px;
  }

  .live{
    top:132px;
    left:20px;
    font-size:15px;
  }

  .chicken{
    transform:scale(.88);
    transform-origin:bottom left;
  }

  .multiplier{
    width:145px;
    height:145px;
    font-size:28px;
  }

  .multi1{
    left:39%;
  }

  .multi2{
    left:78%;
  }

  .panel{
    padding:14px 18px 17px;
  }

  .quick{
    gap:8px;
  }

  .quick button{
    font-size:14px;
  }

  .play{
    height:67px;
    font-size:40px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP -->
  <div class="top">
    <button class="back">‹</button>

    <div class="gameTitle">
      Chicken Road 2
    </div>

    <button class="deposit">
      🪙 Coins ▸
    </button>
  </div>

  <!-- HEADER -->
  <div class="header">

    <div class="logo">
      CHICKEN<span class="two">2</span>ROAD
    </div>

    <div class="balance">
      <span id="balance">1000</span>
      <span class="coin">C</span>
    </div>

    <div class="menu">☰</div>

  </div>

  <!-- LIVE -->
  <div class="live">
    <span class="greenDot"></span>
    Live wins:
    <span style="margin-left:9px">Online:</span>
    <b id="online">10950</b>
  </div>

  <!-- GAME -->
  <div class="game" id="game">

    <div class="grass"></div>

    <div class="sidewalk"></div>

    <div class="road">

      <div class="roadEdge edgeLeft"></div>
      <div class="roadEdge edgeRight"></div>

      <div class="laneLine line1"></div>
      <div class="laneLine line2"></div>

    </div>

    <div class="streetLight"></div>

    <!-- MULTIPLIERS -->
    <div class="multiplier multi1" id="multi1">
      1.18x
    </div>

    <div class="multiplier multi2" id="multi2">
      1.46x
    </div>

    <!-- CHICKEN -->
    <div class="chicken" id="chicken">

      <div class="chickenBody"></div>

      <div class="chickenHead">

        <div class="comb"></div>

        <div class="eye eyeL"></div>
        <div class="eye eyeR"></div>

        <div class="beak"></div>

        <div class="wattle"></div>

      </div>

      <div class="foot foot1"></div>
      <div class="foot foot2"></div>

    </div>

    <!-- VEHICLES -->

    <div class="vehicle car green" id="car1">
      <div class="windowTop"></div>
      <div class="lightA"></div>
      <div class="lightB"></div>
      <div class="bumper"></div>
    </div>

    <div class="vehicle car blue" id="car2">
      <div class="windowTop"></div>
      <div class="lightA"></div>
      <div class="lightB"></div>
      <div class="bumper"></div>
    </div>

    <div class="vehicle car yellow" id="car3">
      <div class="windowTop"></div>
      <div class="lightA"></div>
      <div class="lightB"></div>
      <div class="bumper"></div>
    </div>

    <div class="vehicle truck" id="truck1">
      <div class="truckCab"></div>
      <div class="truckBody"></div>
    </div>

    <!-- COUNTDOWN -->
    <div class="countdown" id="countdown">
      3
    </div>

    <div class="goText" id="goText">
      GO!
    </div>

    <div class="message" id="message"></div>

    <!-- RESULT -->
    <div class="result" id="result">

      <h2 id="resultTitle">
        Round Over
      </h2>

      <p id="resultText"></p>

      <button class="resultBtn" onclick="closeResult()">
        Continue
      </button>

    </div>

  </div>

  <!-- CONTROL PANEL -->
  <div class="panel">

    <div class="bet">

      <button class="betBtn" onclick="setBet(10)">
        MIN
      </button>

      <div class="betNumber">
        <span id="betValue">60</span>
      </div>

      <button class="betBtn" onclick="setBet(500)">
        MAX
      </button>

    </div>

    <div class="quick">

      <button onclick="setBet(40)">
        40 🪙
      </button>

      <button onclick="setBet(60)">
        60 🪙
      </button>

      <button onclick="setBet(150)">
        150 🪙
      </button>

      <button onclick="setBet(400)">
        400 🪙
      </button>

    </div>

    <div class="difficulty">

      <button class="diffButton" onclick="toggleDifficulty()">

        <span id="difficultyText">
          Hard
