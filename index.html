<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Chicken Road 2</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#17191f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

button{
    font-family:inherit;
    border:0;
    outline:0;
}

/* TOP BAR */
.topbar{
    height:112px;
    background:linear-gradient(135deg,#145b5b,#087fc4);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
}

.back{
    width:58px;
    height:58px;
    border-radius:50%;
    background:rgba(0,0,0,.18);
    color:white;
    font-size:34px;
}

.title{
    font-size:28px;
    font-weight:700;
}

.coins{
    min-width:145px;
    height:58px;
    border-radius:18px;
    background:#1597df;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    font-size:22px;
    font-weight:700;
}

.coin{
    width:31px;
    height:31px;
    border-radius:50%;
    background:linear-gradient(#ffe56a,#f5b900);
    border:2px solid #fff1a0;
    color:#9a6500;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    font-weight:bold;
}

/* HEADER */
.gameHeader{
    height:145px;
    background:#20232a;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
}

.logo{
    font-size:32px;
    font-weight:800;
    letter-spacing:-2px;
}

.logo span{
    color:#ed2e35;
    font-size:43px;
}

.balance{
    min-width:180px;
    height:72px;
    border-radius:23px;
    background:#555860;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    font-size:31px;
    font-weight:bold;
}

/* LIVE */
.live{
    position:absolute;
    top:260px;
    left:36px;
    z-index:50;
    background:rgba(55,57,62,.94);
    border-radius:0 0 18px 18px;
    padding:18px 24px;
    font-size:20px;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.greenDot{
    display:inline-block;
    width:20px;
    height:20px;
    border-radius:50%;
    background:#38e66b;
    box-shadow:0 0 16px #38e66b;
    margin-right:12px;
}

/* GAME */
.game{
    position:relative;
    height:calc(100vh - 420px);
    min-height:520px;
    overflow:hidden;
    background:#6b6b6b;
}

/* GRASS */
.grass{
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:28%;
    background:
        radial-gradient(circle at 30% 15%,#6eb62e 0 18px,transparent 19px),
        radial-gradient(circle at 65% 40%,#65ad2d 0 24px,transparent 25px),
        radial-gradient(circle at 25% 75%,#70b833 0 30px,transparent 31px),
        #69ad2d;
}

.grass.right{
    left:auto;
    right:0;
}

/* SIDEWALK */
.sidewalk{
    position:absolute;
    top:0;
    bottom:0;
    left:28%;
    width:10%;
    background:
      repeating-linear-gradient(
        to bottom,
        #c6c7c7 0,
        #c6c7c7 68px,
        #aeb0b0 69px,
        #aeb0b0 72px
      );
    border-left:7px solid #999;
    border-right:7px solid #999;
}

/* ROAD */
.road{
    position:absolute;
    left:38%;
    right:0;
    top:0;
    bottom:0;
    background:#666;
    overflow:hidden;
}

/* ROAD LANES */
.lane{
    position:absolute;
    top:0;
    bottom:0;
    width:33.333%;
}

.lane1{left:0;}
.lane2{left:33.333%;}
.lane3{left:66.666%;}

.lane:not(:last-child){
    border-right:5px dashed rgba(255,255,255,.9);
    background:
      linear-gradient(
        to right,
        transparent 0,
        transparent 93%,
        rgba(255,255,255,.12) 94%,
        transparent 95%
      );
}

/* DASHED LINES */
.roadLine{
    position:absolute;
    width:7px;
    height:75px;
    background:white;
    opacity:.9;
    left:33.333%;
}

.roadLine.r2{
    left:66.666%;
}

/* multiplier */
.multiplier{
    position:absolute;
    z-index:20;
    width:138px;
    height:138px;
    border-radius:50%;
    background:
      repeating-linear-gradient(
        90deg,
        #333 0,
        #333 7px,
        #3d3d3d 8px,
        #3d3d3d 13px
      );
    border:9px solid #474747;
    box-shadow:0 5px 0 #222, inset 0 0 20px #111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:29px;
    font-weight:bold;
    text-shadow:2px 2px #222;
}

.m1{
    left:42%;
    top:42%;
}

.m2{
    left:75%;
    top:58%;
}

/* CHICKEN */
.chicken{
    position:absolute;
    z-index:100;
    width:100px;
    height:120px;
    left:calc(28% - 10px);
    bottom:30px;
    transition:
        left .28s cubic-bezier(.2,.8,.2,1),
        bottom .28s cubic-bezier(.2,.8,.2,1);
    filter:drop-shadow(0 7px 4px rgba(0,0,0,.3));
}

/* chicken body */
.chickenBody{
    position:absolute;
    width:76px;
    height:85px;
    left:10px;
    bottom:12px;
    background:#fff;
    border:4px solid #d9d9d9;
    border-radius:52% 48% 45% 45%;
}

/* head */
.chickenHead{
    position:absolute;
    width:74px;
    height:70px;
    left:13px;
    top:2px;
    background:#fff;
    border:4px solid #d9d9d9;
    border-radius:50%;
}

/* comb */
.comb{
    position:absolute;
    left:34px;
    top:-9px;
    width:42px;
    height:25px;
    background:#ef3035;
    border-radius:55% 45% 40% 20%;
    transform:rotate(-7deg);
}

/* eye */
.eye{
    position:absolute;
    width:22px;
    height:28px;
    background:#fff;
    border:4px solid #111;
    border-radius:50%;
    top:20px;
}

.eye.left{left:25px;}
.eye.right{right:8px;}

.eye:after{
    content:"";
    position:absolute;
    width:8px;
    height:11px;
    border-radius:50%;
    background:#111;
    left:3px;
    top:5px;
}

/* beak */
.beak{
    position:absolute;
    right:-17px;
    top:38px;
    width:0;
    height:0;
    border-top:10px solid transparent;
    border-bottom:10px solid transparent;
    border-left:22px solid #ffbd22;
}

/* wattle */
.wattle{
    position:absolute;
    right:-4px;
    top:53px;
    width:14px;
    height:22px;
    background:#e92e32;
    border-radius:50%;
}

/* feet */
.foot{
    position:absolute;
    bottom:0;
    width:25px;
    height:12px;
    background:#f4ae21;
    border-radius:50%;
}

.foot.left{left:22px;}
.foot.right{left:55px;}

/* CAR */
.car{
    position:absolute;
    z-index:70;
    width:110px;
    height:150px;
    border-radius:23px;
    border:6px solid rgba(0,0,0,.2);
    box-shadow:
        0 10px 15px rgba(0,0,0,.35),
        inset 0 0 0 4px rgba(255,255,255,.12);
    transform:translateX(-160px);
}

/* car windows */
.carWindow{
    position:absolute;
    left:17px;
    top:18px;
    width:65px;
    height:48px;
    border-radius:10px;
    background:#56a9bb;
    border:5px solid #253f47;
}

/* bumper */
.carBumper{
    position:absolute;
    left:17px;
    bottom:20px;
    width:65px;
    height:27px;
    border-radius:8px;
    background:#252932;
}

/* wheels */
.wheel{
    position:absolute;
    width:18px;
    height:50px;
    border-radius:9px;
    background:#202329;
    top:55px;
}

.wheel.left{left:-13px;}
.wheel.right{right:-13px;}

.car.orange{background:#ff9e12;}
.car.blue{background:#238bd7;}
.car.red{background:#ed3c3c;}
.car.green{background:#50c938;}
.car.white{background:#ededed;}

/* CAR TRACK POSITIONS */
.track{
    position:absolute;
    left:0;
    right:0;
    height:160px;
    pointer-events:none;
}

/* Each road lane has separate traffic track */
.track1{top:14%;}
.track2{top:42%;}
.track3{top:70%;}

/* controls */
.controls{
    position:relative;
    z-index:200;
    background:#292b31;
    border:3px solid #44464c;
    border-radius:27px 27px 0 0;
    padding:24px 30px 30px;
}

.betRow{
    height:78px;
    border-radius:17px;
    background:#5b5d64;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    font-size:30px;
}

.betBtn{
    width:105px;
    height:58px;
    border-radius:14px;
    background:#6a6c73;
    color:white;
    font-size:22px;
    font-weight:bold;
}

.quick{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:18px;
}

.quick button{
    height:65px;
    border-radius:15px;
    background:#56585e;
    color:#fff;
    font-size:21px;
    box-shadow:0 5px 10px rgba(0,0,0,.25);
}

.difficulty{
    margin-top:18px;
    height:72px;
    background:#595b61;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    font-size:26px;
    font-weight:bold;
}

/* START */
.startBtn{
    margin-top:20px;
    width:100%;
    height:88px;
    border-radius:20px;
    background:#39cf57;
    color:white;
    font-size:38px;
    font-weight:800;
    box-shadow:0 7px 0 #209c38;
    cursor:pointer;
}

.startBtn:active{
    transform:translateY(4px);
    box-shadow:0 3px 0 #209c38;
}

/* game message */
.message{
    position:absolute;
    z-index:500;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:rgba(25,27,31,.96);
    border:3px solid #555;
    border-radius:22px;
    width:85%;
    max-width:380px;
    padding:30px 22px;
    text-align:center;
    display:none;
}

.message h2{
    font-size:35px;
    margin-bottom:12px;
}

.message p{
    color:#ddd;
    font-size:18px;
    margin-bottom:22px;
}

.message button{
    width:100%;
    height:58px;
    border-radius:15px;
    background:#39cf57;
    color:white;
    font-size:22px;
    font-weight:bold;
}

/* responsive */
@media(max-width:600px){

    .topbar{
        height:86px;
        padding:0 12px;
    }

    .back{
        width:48px;
        height:48px;
    }

    .title{
        font-size:23px;
    }

    .coins{
        min-width:115px;
        height:50px;
        font-size:18px;
    }

    .gameHeader{
        height:120px;
        padding:0 20px;
    }

    .logo{
        font-size:25px;
    }

    .logo span{
        font-size:35px;
    }

    .balance{
        min-width:135px;
        height:58px;
        font-size:24px;
    }

    .live{
        top:205px;
        left:36px;
        padding:14px 18px;
        font-size:17px;
    }

    .game{
        height:calc(100vh - 390px);
        min-height:480px;
    }

    .controls{
        padding:18px 20px 24px;
    }

    .betRow{
        height:72px;
        font-size:27px;
    }

    .betBtn{
        width:95px;
    }

    .quick{
        gap:10px;
    }

    .quick button{
        font-size:18px;
        height:60px;
    }

    .difficulty{
        font-size:23px;
    }

    .startBtn{
        height:78px;
        font-size:32px;
    }

    .multiplier{
        width:120px;
        height:120px;
        font-size:25px;
    }

    .car{
        width:96px;
        height:130px;
    }

    .carWindow{
        width:56px;
        height:43px;
    }

    .carBumper{
        width:56px;
    }

    .chicken{
        transform:scale(.88);
        transform-origin:bottom left;
    }
}
</style>
</head>

<body>

<!-- TOP -->
<div class="topbar">

    <button class="back">‹</button>

    <div class="title">Chicken Road 2</div>

    <div class="coins">
        <div class="coin">C</div>
        <span id="topCoins">1000</span>
    </div>

</div>

<!-- HEADER -->
<div class="gameHeader">

    <div class="logo">
        CHICKEN <span>2</span> ROAD
    </div>

    <div class="balance">
        <span id="balance">1000</span>
        <div class="coin">C</div>
    </div>

</div>

<!-- GAME -->
<div class="game" id="game">

    <div class="grass"></div>
    <div class="grass right"></div>

    <div class="sidewalk"></div>

    <div class="road">

        <div class="lane lane1"></div>
        <div class="lane lane2"></div>
        <div class="lane lane3"></div>

        <div class="roadLine" style="top:10%"></div>
        <div class="roadLine" style="top:40%"></div>
        <div class="roadLine" style="top:70%"></div>

        <div class="roadLine r2" style="top:20%"></div>
        <div class="roadLine r2" style="top:55%"></div>
        <div class="roadLine r2" style="top:85%"></div>

        <div class="multiplier m1">
            <span id="multi1">1.18x</span>
        </div>

        <div class="multiplier m2">
            <span id="multi2">1.46x</span>
        </div>

        <!-- TRACK 1 -->
        <div class="track track1" id="track1"></div>

        <!-- TRACK 2 -->
        <div class="track track2" id="track2"></div>

        <!-- TRACK 3 -->
        <div class="track track3" id="track3"></div>

    </div>

    <!-- CHICKEN -->
    <div class="chicken" id="chicken">

        <div class="comb"></div>

        <div class="chickenHead">

            <div class="eye left"></div>
            <div class="eye right"></div>

            <div class="beak"></div>
            <div class="wattle"></div>

        </div>

        <div class="chickenBody"></div>

        <div class="foot left"></div>
        <div class="foot right"></div>

    </div>

    <!-- LIVE -->
    <div class="live">
        <span class="greenDot"></span>
        Live wins:
        <b>Online: <span id="online">10974</span></b>
    </div>

    <!-- MESSAGE -->
    <div class="message" id="message">

        <h2 id="messageTitle">Game Over</h2>

        <p id="messageText">
            The chicken was hit.
        </p>

        <button onclick="resetGame()">PLAY AGAIN</button>

    </div>

</div>

<!-- CONTROLS -->
<div class="controls">

    <div class="betRow">

        <button class="betBtn"
        onclick="setBet('min')">MIN</button>

        <span id="betValue">60</span>

        <button class="betBtn"
        onclick="setBet('max')">MAX</button>

    </div>

    <div class="quick">

        <button onclick="setBetValue(40)">
            40 🪙
        </button>

        <button onclick="setBetValue(60)">
            60 🪙
        </button>

        <button onclick="setBetValue(150)">
            150 🪙
        </button>

        <button onclick="setBetValue(400)">
            400 🪙
        </button>

    </div>

    <div class="difficulty">
        <span>Hard</span>
        <span>⌄</span>
    </div>

    <!-- THIS IS THE IMPORTANT BUTTON -->
    <button class="startBtn"
            id="startBtn"
            onclick="moveChicken()">
        ⭐ START
    </button>

</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

let balance = 1000;
let bet = 60;

let chickenStep = 0;
let playing = false;
let gameOver = false;

const maxSteps = 5;

const chicken = document.getElementById("chicken");
const startBtn = document.getElementById("startBtn");

const message = document.getElementById("message");
const messageTitle = document.getElementById("messageTitle");
const messageText = document.getElementById("messageText");

const online = document.getElementById("online");

/* =========================
   BET
========================= */

function setBetValue(value){

    bet = value;

    document.getElementById("betValue").textContent = bet;
}

function setBet(type){

    if(type === "min"){
        bet = 40;
    }

    if(type === "max"){
        bet = 400;
    }

    document.getElementById("betValue").textContent = bet;
}

/* =========================
   START GAME
========================= */

function startGame(){

    if(balance < bet){

        showMessage(
            "Not Enough Coins",
            "You don't have enough coins for this game."
        );

        return;
    }

    balance -= bet;

    updateCoins();

    chickenStep = 0;
    playing = true;
    gameOver = false;

    chicken.style.left = "calc(28% - 10px)";
    chicken.style.bottom = "30px";

    startBtn.textContent = "⭐ MOVE FORWARD";

    hideMessage();

    startTraffic();
}

/* =========================
   MAIN BUTTON
========================= */

function moveChicken(){

    if(!playing){

        startGame();

        return;
    }

    if(gameOver) return;

    chickenStep++;

    /*
      Chicken moves upward.
      Every click = exactly ONE step.
    */

    const stepHeight =
        Math.max(75, document.querySelector(".game").clientHeight / 6);

    chicken.style.bottom =
        (30 + chickenStep * stepHeight) + "px";

    /*
      Chicken gradually moves toward
      the road tracks.
    */

    if(chickenStep === 1){

        chicken.style.left = "calc(38% + 5px)";

    }else if(chickenStep === 2){

        chicken.style.left = "calc(38% + 11%)";

    }else if(chickenStep === 3){

        chicken.style.left = "calc(38% + 22%)";

    }else if(chickenStep === 4){

        chicken.style.left = "calc(38% + 33%)";

    }else if(chickenStep >= maxSteps){

        winGame();

        return;
    }

    /*
      Small jump animation
    */

    chicken.animate(
        [
            {transform:"translateY(0) scale(.88)"},
            {transform:"translateY(-25px) scale(.94)"},
            {transform:"translateY(0) scale(.88)"}
        ],
        {
            duration:280,
            easing:"ease-out"
        }
    );

    /*
      Check collision after movement.
    */

    setTimeout(checkCollision,170);
}

/* =========================
   TRAFFIC
========================= */

let cars = [];

function createCar(track, direction, color, speed, delay){

    setTimeout(function(){

        const car = document.createElement("div");

        car.className = "car " + color;

        const windowBox =
            document.createElement("div");

        windowBox.className = "carWindow";

        const bumper =
            document.createElement("div");

        bumper.className = "carBumper";

        const wheelLeft =
            document.createElement("div");

        wheelLeft.className = "wheel left";

        const wheelRight =
            document.createElement("div");

        wheelRight.className = "wheel right";

        car.appendChild(windowBox);
        car.appendChild(bumper);
        car.appendChild(wheelLeft);
        car.appendChild(wheelRight);

        track.appendChild(car);

        let x =
            direction === "right"
            ? -150
            : track.parentElement.clientWidth + 20;

        let running = true;

        function animateCar(){

            if(!running){

                requestAnimationFrame(animateCar);

                return;
            }

            x +=
                direction === "right"
                ? speed
                : -speed;

            car.style.transform =
                "translateX(" + x + "px)";

            /*
              Remove when completely outside.
            */

            if(
                direction === "right" &&
                x > track.parentElement.clientWidth + 180
            ){

                car.remove();
                running = false;
                return;
            }

            if(
                direction === "left" &&
                x < -220
            ){

                car.remove();
                running = false;
                return;
            }

            /*
              Collision detection.
            */

            if(playing && !gameOver){

                const chickenRect =
                    chicken.getBoundingClientRect();

                const carRect =
                    car.getBoundingClientRect();

                /*
                  Only check collision when
                  chicken is on road area.
                */

                if(
                    chickenStep > 0 &&
                    rectCollision(
                        chickenRect,
                        carRect
                    )
                ){

                    hitChicken();

                    return;
                }
            }

            requestAnimationFrame(animateCar);
        }

        requestAnimationFrame(animateCar);

        cars.push({
            element:car,
            stop:function(){
                running=false;
            }
        });

    },delay);
}

/* =========================
   TRAFFIC SETUP
========================= */

function startTraffic(){

    /*
      Clear old traffic
    */

    document
    .querySelectorAll(".car")
    .forEach(c => c.remove());

    cars = [];

    /*
      TRACK 1
      Separate traffic lane
    */

    createCar(
        document.getElementById("track1"),
        "right",
        "orange",
        2.2,
        300
    );

    createCar(
        document.getElementById("track1"),
        "left",
        "blue",
        1.8,
        1800
    );

    /*
      TRACK 2
    */

    createCar(
        document.getElementById("track2"),
        "left",
        "red",
        2.0,
        800
    );

    createCar(
        document.getElementById("track2"),
        "right",
        "green",
        1.7,
        2500
    );

    /*
      TRACK 3
    */

    createCar(
        document.getElementById("track3"),
        "right",
        "white",
        2.3,
        1200
    );

    createCar(
        document.getElementById("track3"),
        "left",
        "orange",
        1.9,
        3200
    );

    /*
      Continuously add new cars
    */

    trafficLoop();
}

let trafficTimer = null;

function trafficLoop(){

    clearTimeout(trafficTimer);

    trafficTimer =
        setTimeout(function(){

            if(!playing || gameOver){

                trafficLoop();

                return;
            }

            const tracks = [
                document.getElementById("track1"),
                document.getElementById("track2"),
                document.getElementById("track3")
            ];

            const colors =
                ["orange","blue","red","green","white"];

            const track =
                tracks[
                    Math.floor(
                        Math.random()*tracks.length
                    )
                ];

            const direction =
                Math.random() > .5
                ? "right"
                : "left";

            const color =
                colors[
                    Math.floor(
                        Math.random()*colors.length
                    )
                ];

            const speed =
                1.5 + Math.random()*1.2;

            createCar(
                track,
                direction,
                color,
                speed,
                0
            );

            trafficLoop();

        },1700);

}

/* =========================
   COLLISION
========================= */

function rectCollision(a,b){

    return !(
        a.right < b.left + 12 ||
        a.left > b.right - 12 ||
        a.bottom < b.top + 12 ||
        a.top > b.bottom - 12
    );
}

/* =========================
   HIT
========================= */

function hitChicken(){

    if(gameOver) return;

    gameOver = true;
    playing = false;

    clearTimeout(trafficTimer);

    startBtn.textContent = "⭐ START";

    chicken.animate(
        [
            {transform:"rotate(0deg)"},
            {transform:"rotate(-20deg)"},
            {transform:"rotate(20deg)"},
            {transform:"rotate(-20deg)"},
            {transform:"rotate(0deg)"}
        ],
        {
            duration:500
        }
    );

    showMessage(
        "💥 Chicken Hit!",
        "The chicken was hit by a car."
    );
}

/* =========================
   WIN
========================= */

function winGame(){

    gameOver = true;
    playing = false;

    clearTimeout(trafficTimer);

    const reward =
        Math.floor(bet * 1.46);

    balance += reward;

    updateCoins();

    startBtn.textContent = "⭐ START";

    showMessage(
        "🎉 YOU WIN!",
        "Chicken crossed the road! +" +
        reward +
        " coins"
    );
}

/* =========================
   MESSAGE
========================= */

function showMessage(title,text){

    messageTitle.textContent = title;
    messageText.textContent = text;

    message.style.display = "block";
}

function hideMessage(){

    message.style.display = "none";
}

/* =========================
   RESET
========================= */

function resetGame(){

    hideMessage();

    chickenStep = 0;
    playing = false;
    gameOver = false;

    chicken.style.left = "calc(28% - 10px)";
    chicken.style.bottom = "30px";

    startBtn.textContent = "⭐ START";

    document
    .querySelectorAll(".car")
    .forEach(c => c.remove());

    clearTimeout(trafficTimer);
}

/* =========================
   COINS
========================= */

function updateCoins(){

    document.getElementById("balance")
        .textContent = balance;

    document.getElementById("topCoins")
        .textContent = balance;
}

/* =========================
   ONLINE NUMBER
========================= */

setInterval(function(){

    let n =
        10950 +
        Math.floor(Math.random()*40);

    online.textContent = n;

},3000);


/* =========================
   IMPORTANT:
   INITIAL STATE
========================= */

resetGame();

</script>
